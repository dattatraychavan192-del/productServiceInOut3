<div class="card mt-4">
  <div class="card-header text-center">
    <strong>
      {{ IsineditMode ? "Update Product" : "Add Product" }}
    </strong>
  </div>
  <div class="card-body">
    <form #pdtForm="ngForm" (ngSubmit)="submitPdt()">
      <div class="form-group">
        <label for="">Title</label>
        <input required type="text" ngModel name="title" class="form-control" />
      </div>
      <div class="form-group">
        <label for="">Price</label>
        <input required type="text" name="price" ngModel class="form-control" />
      </div>
      <div class="form-group">
        <label for="">Category</label>
        <input
          required
          type="text"
          name="category"
          class="form-control"
          ngModel
        />
      </div>
      <div class="form-group">
        <label for="image">Image URL</label>
        <input
          required
          type="text"
          id="image"
          name="image"
          ngModel
          class="form-control"
          placeholder="Enter image URL"
        />
      </div>
      <button
        *ngIf="!IsineditMode"
        mat-raised-button
        color="primary"
        class="btn btn-outline-primary btn-block"
      >
        Add Product
      </button>
      <button
        type="button"
        *ngIf="IsineditMode"
        mat-raised-button.
        color="primary"
        class="btn btn-outline-primary btn-block"
        (click)="updateStd()"
      >
        Update Product
      </button>
    </form>
  </div>
</div>
